<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 48 48" fill="none">
  <!-- Paper background -->
  <rect width="48" height="48" fill="#f5f0e8"/>

  <!-- Ink border (zine cutout feel) -->
  <rect x="2" y="2" width="44" height="44" stroke="#1a1a1a" stroke-width="3" fill="none"/>

  <!-- Microphone body -->
  <rect x="15" y="6" width="18" height="24" rx="9" fill="#1a1a1a"/>

  <!-- Grille lines -->
  <line x1="19" y1="12" x2="29" y2="12" stroke="#f5f0e8" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="19" y1="16" x2="29" y2="16" stroke="#f5f0e8" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="19" y1="20" x2="29" y2="20" stroke="#f5f0e8" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="19" y1="24" x2="29" y2="24" stroke="#f5f0e8" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Stand arc -->
  <path d="M11 27C11 35 17 40 24 40C31 40 37 35 37 27" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Stand base -->
  <line x1="24" y1="40" x2="24" y2="44" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="44" x2="30" y2="44" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- Red accent dot (cutout-red) -->
  <circle cx="38" cy="10" r="4" fill="#e63946"/>
</svg>
