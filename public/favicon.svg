<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="micGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="standGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Microphone body -->
  <rect x="14" y="6" width="20" height="26" rx="10" fill="url(#micGradient)"/>

  <!-- Grille lines -->
  <line x1="18" y1="12" x2="30" y2="12" stroke="white" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="18" y1="16" x2="30" y2="16" stroke="white" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="18" y1="20" x2="30" y2="20" stroke="white" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="18" y1="24" x2="30" y2="24" stroke="white" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Stand arc -->
  <path d="M10 28C10 36 16 42 24 42C32 42 38 36 38 28" stroke="url(#standGradient)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Stand base -->
  <line x1="24" y1="42" x2="24" y2="46" stroke="url(#standGradient)" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="46" x2="30" y2="46" stroke="url(#standGradient)" stroke-width="3" stroke-linecap="round"/>

  <!-- Highlight -->
  <ellipse cx="19" cy="14" rx="2" ry="3" fill="white" fill-opacity="0.3"/>
</svg>
