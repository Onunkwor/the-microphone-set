<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 48 48" fill="none">
  <!-- Paper background with rough edge feel -->
  <rect width="48" height="48" fill="#f5f0e8"/>

  <!-- Cutout red diagonal stripe (zine punk slash) -->
  <polygon points="0,0 20,0 48,28 48,48 28,48 0,20" fill="#e63946"/>

  <!-- Bold "M" letterform — hand-cut style -->
  <path d="M10 38V14L18 26L24 16L30 26L38 14V38" stroke="#1a1a1a" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>

  <!-- Ink border — uneven cutout rectangle -->
  <path d="M2 3L46 2L47 46L3 47Z" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>

  <!-- Small tape strip accent -->
  <rect x="14" y="0" width="20" height="5" fill="#ffd166" opacity="0.75" transform="rotate(-2 24 2.5)"/>
</svg>
